<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | YamYam</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages/login.css">
  <link rel="stylesheet" href="../css/pages/signup.css">
</head>
<body>
  <main class="auth auth--signup">
    <!-- 왼쪽 장식 (스크롤해도 제자리) -->
    <div class="auth__visual" aria-hidden="true">
      <div class="plate-wrap">
        <!-- 메인에서 넘어올 때 접시가 미끄러져 멈추는 자리 (위치를 바꾸면 main.js의 계산도 함께 바꿀 것) -->
        <div class="plate">
          <img class="plate__img" src="../assets/img/plate-cutlery.webp" alt="">
        </div>
        <img class="sparks" src="../assets/img/sparks.svg" alt="">
      </div>
    </div>

    <!-- 오른쪽 회원가입 폼 -->
    <section class="auth__panel">
      <a class="logo auth__logo" href="../index.html">YamYam</a>
      <h1 class="auth__title">회원가입</h1>

      <form id="signup-form" class="auth__form" novalidate>
        <!-- 아이디 + 중복 확인 -->
        <div>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-6.5 8-6.5s7 2 8 6.5"/></svg>
            <label class="sr-only" for="signup-userId">아이디</label>
            <input id="signup-userId" name="userId" placeholder="아이디 (영문 소문자·숫자 4~16자)" autocomplete="username">
            <button class="field__action" type="button" id="check-id-btn">중복 확인</button>
          </div>
          <p class="error" data-error="userId"></p>
        </div>

        <!-- 비밀번호 -->
        <div>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg>
            <label class="sr-only" for="signup-password">비밀번호</label>
            <input id="signup-password" name="password" type="password" placeholder="비밀번호 (4~20자)" autocomplete="new-password">
            <button class="toggle-password" type="button" data-action="toggle-password" aria-label="비밀번호 보기">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
            </button>
          </div>
          <p class="error" data-error="password"></p>
        </div>

        <!-- 비밀번호 확인 -->
        <div>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M9.5 15.5l1.8 1.8 3.4-3.6"/></svg>
            <label class="sr-only" for="signup-passwordConfirm">비밀번호 확인</label>
            <input id="signup-passwordConfirm" name="passwordConfirm" type="password" placeholder="비밀번호 확인" autocomplete="new-password">
            <button class="toggle-password" type="button" data-action="toggle-password" aria-label="비밀번호 보기">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
            </button>
          </div>
          <p class="error" data-error="passwordConfirm"></p>
        </div>

        <!-- 이름 -->
        <div>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.4" stroke-linecap="round"/></svg>
            <label class="sr-only" for="signup-name">이름</label>
            <input id="signup-name" name="name" placeholder="이름" autocomplete="name">
          </div>
          <p class="error" data-error="name"></p>
        </div>

        <!-- 키 / 몸무게 -->
        <div class="field-row">
          <div>
            <div class="field">
              <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="2.5" width="8" height="19" rx="1.5"/><path d="M8 6.5h3M8 10h2M8 13.5h3M8 17h2"/></svg>
              <label class="sr-only" for="signup-height">키</label>
              <input id="signup-height" name="height" type="number" inputmode="decimal" step="0.1" placeholder="키">
              <span class="field__unit">cm</span>
            </div>
            <p class="error" data-error="height"></p>
          </div>
          <div>
            <div class="field">
              <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8.5 10a3.5 3.5 0 0 1 7 0"/><path d="M12 10l1.3-2"/></svg>
              <label class="sr-only" for="signup-weight">몸무게</label>
              <input id="signup-weight" name="weight" type="number" inputmode="decimal" step="0.1" placeholder="몸무게">
              <span class="field__unit">kg</span>
            </div>
            <p class="error" data-error="weight"></p>
          </div>
        </div>

        <!-- 질환 정보 -->
        <fieldset class="choice-group">
          <legend>질환 정보 <small class="choice-group__multi">여러 개 선택 가능</small></legend>
          <!-- 체크박스 묶음: '없음'(data-exclusive)은 다른 칸과 함께 고를 수 없다 -->
          <div class="choice-list">
            <label class="choice"><input type="checkbox" name="diseaseInfo" value="없음" data-exclusive checked><span>없음</span></label>
            <label class="choice"><input type="checkbox" name="diseaseInfo" value="고혈압"><span>고혈압</span></label>
            <label class="choice"><input type="checkbox" name="diseaseInfo" value="당뇨"><span>당뇨</span></label>
          </div>
          <p class="choice-group__hint">선택한 질환에 맞춰 식단 분석 기준이 달라져요.</p>
          <p class="error" data-error="diseaseInfo"></p>
        </fieldset>

        <p class="error auth__form-error" data-error="form"></p>
        <button class="btn-primary" type="submit">가입하기</button>
      </form>

      <p class="helper-text">이미 회원이신가요?<a class="link-green" href="login.html">로그인</a></p>
    </section>
  </main>

  <script type="module" src="../js/pages/signup.js"></script>
</body>
</html>
