<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로필 | YamYam</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages/mypage.css">
</head>
<body>
  <header class="site-header" data-auth="member">
    <a class="logo" href="../index.html">YamYam</a>
    <nav class="site-nav">
      <a class="site-nav__link" href="meal-list.html">식단 기록</a>
      <a class="site-nav__link" href="recommend.html">추천식단</a>
      <a class="site-nav__link" href="mypage.html" aria-current="page">프로필</a>
      <details class="profile-menu">
        <summary aria-label="내 메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="#3a3d40" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-6.5 8-6.5s7 2 8 6.5"/></svg></summary>
        <div class="profile-menu__panel">
          <p class="profile-menu__name"><span data-field="name"></span>님</p>
          <a class="profile-menu__item" href="mypage.html">프로필</a>
          <button class="profile-menu__item" type="button" id="logout-btn">로그아웃</button>
        </div>
      </details>
    </nav>
  </header>

  <main class="page page--narrow">
    <div class="page-head">
      <h1 class="page-title">프로필</h1>
    </div>

    <!-- 내 정보 -->
    <section class="card profile">
      <div class="profile__top">
        <div class="profile__avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-6.5 8-6.5s7 2 8 6.5"/></svg>
        </div>
        <div>
          <p class="profile__name" data-field="name"></p>
          <p class="profile__id">@<span data-field="userId"></span></p>
        </div>
        <div class="profile__tags">
          <span class="profile__tag" data-field="goalLabel"></span>
          <span class="profile__tag profile__tag--disease" data-field="diseaseInfo"></span>
        </div>
      </div>
      <dl class="nutrients profile__stats">
        <div><dt>키</dt><dd><span data-field="height"></span><small>cm</small></dd></div>
        <div><dt>몸무게</dt><dd><span data-field="weight"></span><small>kg</small></dd></div>
        <div><dt>BMI</dt><dd><span data-field="bmi"></span><small data-field="bmiLabel"></small></dd></div>
        <div><dt>하루 권장 열량</dt><dd><span data-field="targetKcal"></span><small>kcal</small></dd></div>
      </dl>
    </section>

    <!-- 프로필 수정 -->
    <form id="user-form" class="card" novalidate>
      <h2 class="card-title">프로필 수정</h2>
      <div class="form-row">
        <label class="form-label" for="u-name">이름</label>
        <input class="input" id="u-name" name="name" autocomplete="name">
        <p class="error" data-error="name"></p>
      </div>
      <div class="form-row">
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label" for="u-height">키 (cm)</label>
            <input class="input" id="u-height" name="height" type="number" step="0.1">
            <p class="error" data-error="height"></p>
          </div>
          <div class="form-row">
            <label class="form-label" for="u-weight">몸무게 (kg)</label>
            <input class="input" id="u-weight" name="weight" type="number" step="0.1">
            <p class="error" data-error="weight"></p>
          </div>
        </div>
      </div>
      <div class="form-row">
        <span class="form-label">질환 정보 <small class="form-optional">여러 개 선택 가능</small></span>
        <div class="choice-list">
          <label class="choice"><input type="checkbox" name="diseaseInfo" value="없음" data-exclusive><span>없음</span></label>
          <label class="choice"><input type="checkbox" name="diseaseInfo" value="고혈압"><span>고혈압</span></label>
          <label class="choice"><input type="checkbox" name="diseaseInfo" value="당뇨"><span>당뇨</span></label>
        </div>
        <p class="error" data-error="diseaseInfo"></p>
      </div>
      <div class="form-row">
        <span class="form-label">목표 <small class="form-optional">하루 권장 열량에 반영돼요</small></span>
        <div class="choice-list">
          <label class="choice"><input type="radio" name="goal" value="감량"><span>체중 감량</span></label>
          <label class="choice"><input type="radio" name="goal" value="유지"><span>체중 유지</span></label>
          <label class="choice"><input type="radio" name="goal" value="증량"><span>체중 증량</span></label>
        </div>
        <p class="error" data-error="goal"></p>
      </div>
      <div class="form-row">
        <span class="form-label">비밀번호 변경 <small class="form-optional">바꾸지 않으려면 비워 두세요</small></span>
        <div class="form-grid">
          <div>
            <div class="field field--sm">
              <label class="sr-only" for="u-password">새 비밀번호</label>
              <input id="u-password" name="password" type="password" placeholder="새 비밀번호 (4~20자)" autocomplete="new-password">
              <button class="toggle-password" type="button" data-action="toggle-password" aria-label="비밀번호 보기">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
              </button>
            </div>
            <p class="error" data-error="password"></p>
          </div>
          <div>
            <div class="field field--sm">
              <label class="sr-only" for="u-password2">새 비밀번호 확인</label>
              <input id="u-password2" name="passwordConfirm" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password">
              <button class="toggle-password" type="button" data-action="toggle-password" aria-label="비밀번호 보기">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
              </button>
            </div>
            <p class="error" data-error="passwordConfirm"></p>
          </div>
        </div>
      </div>
      <p class="error" data-error="form"></p>
      <div class="form-actions">
        <button class="btn-primary" type="submit">저장하기</button>
      </div>
    </form>

    <!-- 회원 탈퇴: 권장하는 기능이 아니므로 맨 아래 작은 글씨로만 두고, 눌러야 펼쳐진다 -->
    <details class="withdraw">
      <summary>회원 탈퇴</summary>
      <form id="withdraw-form" class="withdraw__form" novalidate>
        <p class="withdraw__desc">탈퇴하면 같은 아이디로 다시 가입할 수 없어요. 본인 확인을 위해 비밀번호를 입력하세요.</p>
        <div class="withdraw__row">
          <div class="withdraw__input">
            <div class="field field--sm">
              <label class="sr-only" for="w-password">비밀번호</label>
              <input id="w-password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password">
              <button class="toggle-password" type="button" data-action="toggle-password" aria-label="비밀번호 보기">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
              </button>
            </div>
            <p class="error" data-error="password"></p>
            <p class="error" data-error="form"></p>
          </div>
          <button class="withdraw__btn" type="submit">탈퇴하기</button>
        </div>
      </form>
    </details>
  </main>

  <script type="module" src="../js/pages/mypage.js"></script>
</body>
</html>
