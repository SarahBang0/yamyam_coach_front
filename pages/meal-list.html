<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>식단 기록 | YamYam</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages/meal-list.css">
</head>
<body>
  <header class="site-header" data-auth="member">
    <a class="logo" href="../index.html">YamYam</a>
    <nav class="site-nav">
      <a class="site-nav__link" href="meal-list.html" aria-current="page">식단 기록</a>
      <a class="site-nav__link" href="recommend.html">추천식단</a>
      <a class="site-nav__link" href="mypage.html">프로필</a>
      <details class="profile-menu">
        <summary aria-label="내 메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="#3a3d40" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-6.5 8-6.5s7 2 8 6.5"/></svg></summary>
        <div class="profile-menu__panel">
          <p class="profile-menu__name"><span data-field="name"></span>님</p>
          <a class="profile-menu__item" href="mypage.html">프로필</a>
          <button class="profile-menu__item" type="button" id="logout-btn">로그아웃</button>
        </div>
      </details>
    </nav>
  </header>

  <main class="page page--narrow">
    <div class="page-head">
      <h1 class="page-title">식단 기록</h1>
    </div>

    <!-- 날짜 이동: ‹ 날짜 › (가운데는 YamYam 달력) -->
    <form id="meal-filter" class="date-bar">
      <button class="date-bar__step" type="button" id="date-prev" aria-label="전날">‹</button>
      <div class="datepicker" data-datepicker>
        <input type="hidden" name="date">
        <button type="button" class="datepicker__trigger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span data-datepicker-label></span>
        </button>
      </div>
      <button class="date-bar__step" type="button" id="date-next" aria-label="다음 날">›</button>
    </form>

    <!-- 그날 영양 요약 -->
    <section class="day" id="day-summary">
      <p class="day__kcal">
        <strong data-field="calorie">0</strong>
        <span class="day__target">/ <span data-field="targetKcal">0</span> kcal</span>
        <em class="day__rate"><span data-field="kcalRate">0</span>%</em>
      </p>
      <div class="bar bar--lg" id="day-kcal"><div class="bar-fill"></div></div>

      <div class="day__detail">
        <div class="macro">
          <div class="macro__row" id="day-macro-carb">
            <span class="macro__name">탄수화물</span>
            <div class="bar"><div class="bar-fill"></div></div>
            <span class="macro__value"><span data-field="value">0</span>%</span>
          </div>
          <div class="macro__row macro__row--protein" id="day-macro-protein">
            <span class="macro__name">단백질</span>
            <div class="bar"><div class="bar-fill"></div></div>
            <span class="macro__value"><span data-field="value">0</span>%</span>
          </div>
          <div class="macro__row macro__row--fat" id="day-macro-fat">
            <span class="macro__name">지방</span>
            <div class="bar"><div class="bar-fill"></div></div>
            <span class="macro__value"><span data-field="value">0</span>%</span>
          </div>
        </div>
        <dl class="day__nutrients">
          <div><dt>탄수화물</dt><dd><span data-field="carbohydrate">0</span>g</dd></div>
          <div><dt>단백질</dt><dd><span data-field="protein">0</span>g</dd></div>
          <div><dt>지방</dt><dd><span data-field="fat">0</span>g</dd></div>
          <div><dt>나트륨</dt><dd><span data-field="sodium">0</span>mg</dd></div>
          <div><dt>당류</dt><dd><span data-field="sugar">0</span>g</dd></div>
        </dl>
      </div>
      <p class="macro__range">권장 비율: 탄수화물 55~65% · 단백질 7~20% · 지방 15~30%</p>
    </section>

    <!-- 그날 먹은 식사 -->
    <section class="meals">
      <div class="meals__head">
        <h2 class="meals__title">식사 <span data-field="mealCount">0</span></h2>
        <a class="meals__add" href="meal-form.html">+ 식단 등록</a>
      </div>
      <ul id="meal-list" class="meal-list"></ul>
      <p id="meal-empty" class="empty-state" hidden>이날 기록한 식사가 없어요.</p>
    </section>
  </main>

  <!-- 식단 등록: 오른쪽 아래 떠 있는 + 버튼 (애니메이션이 걸리는 main 밖에 둔다) -->
  <a class="fab" href="meal-form.html" aria-label="식단 등록하기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="fab__label" aria-hidden="true">식단 등록</span>
  </a>

  <template id="meal-item">
    <li>
      <a class="meal-item" data-field="link">
        <span class="meal-item__type" data-field="mealType"></span>
        <div class="meal-item__body">
          <p class="meal-item__foods" data-field="foodNames"></p>
          <p class="meal-item__meta"><span data-field="calorie"></span> kcal · <span data-field="score"></span>점</p>
        </div>
        <span class="grade" data-field="grade"></span>
      </a>
    </li>
  </template>

  <script type="module" src="../js/pages/meal-list.js"></script>
</body>
</html>
