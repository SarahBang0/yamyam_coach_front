<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 접시 옆 '반짝' 표시: 안쪽은 가늘고 바깥은 둥근, 살짝 휜 획 3개 + 작은 점 -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#23954a"/>
      <stop offset="1" stop-color="#4cc96f"/>
    </linearGradient>
  </defs>
  <style>
    .m { fill: url(#g); transform-box: fill-box; animation: twinkle 3.2s ease-in-out infinite; }
    .m1 { transform-origin: 20% 100%; }
    .m2 { transform-origin: 0% 100%; animation-delay: 0.18s; }
    .m3 { transform-origin: 0% 50%; animation-delay: 0.36s; }
    .dot { fill: #9be0ae; transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out 0.6s infinite; }
    @keyframes twinkle {
      0%, 55%, 100% { transform: scale(1); opacity: 1; }
      70% { transform: scale(0.78); opacity: 0.7; }
    }
    @media (prefers-reduced-motion: reduce) { .m, .dot { animation: none; } }
  </style>
  <path class="m m1" d="M23 46 C22.4 34 24.8 22.5 29.6 11.6 A4.6 4.6 0 0 1 38 15.3 C33.4 25.6 29.1 36.1 26.2 46.6 A1.65 1.65 0 0 1 23 46 Z"/>
  <path class="m m2" d="M40.4 57.2 C50 49.6 59.4 42.7 69.4 36.6 A4.6 4.6 0 0 1 74.2 44.5 C63.8 49.1 53.2 54.4 42.3 59.9 A1.65 1.65 0 0 1 40.4 57.2 Z"/>
  <path class="m m3" d="M46.2 76.6 C58.8 75.6 71.2 76.1 83.8 77.8 A4.6 4.6 0 0 1 83.2 87 C71 84.8 58.4 82.2 45.9 79.9 A1.65 1.65 0 0 1 46.2 76.6 Z"/>
  <circle class="dot" cx="56" cy="21" r="3.6"/>
</svg>
